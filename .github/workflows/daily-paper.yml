name: Daily Greater Hyderabad paper
on:
  workflow_dispatch:
# Legacy publisher is manual-only. Version 0.4 prepares the issue on the phone.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-paper
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r publisher/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s publisher -p 'test_*.py'
      - run: python -u publisher/publish.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish only the completed issue
        id: deployment
        uses: actions/deploy-pages@v4
